
  <div class="caja">
    <div class="spinner"></div>
    <p>Verificando tus datos...</p>
    <p class="alt">Te estamos redirigiendo al portal de alumnos.</p>

    <form id="puente" action="{{ destino }}" method="{{ metodo }}">
      <input type="hidden" name="txtCuenta" value="{{ cuenta }}">
      <input type="hidden" name="txtNip" value="{{ nip }}">
      <input type="hidden" name="Entrada" value="{{ boton }}">
      {% for nombre, valor in extra.items() %}
      <input type="hidden" name="{{ nombre }}" value="{{ valor }}">
      {% endfor %}
      
    </form>

    <p class="alt"><a href="{{ destino }}">Si no avanza, haz clic aqui</a></p>
  </div>
